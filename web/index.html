<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un poema al día</title>
<meta name="description" content="Un poema en dominio público cada día.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #fafafa;
    color: #222;
    display: flex;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  .poem {
    max-width: 48ch;
  }
  .author {
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 0.5rem;
    font-style: italic;
  }
  .title {
    font-size: 1.5rem;
    margin-bottom: 2rem;
    font-weight: normal;
  }
  .text {
    white-space: pre-line;
    line-height: 1.8;
    font-size: 1.05rem;
    text-align: justify;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #fff; }
    .author { color: #aaa; }
  }
</style>
</head>
<body>
<main class="poem">
  <div class="author" id="author"></div>
  <h1 class="title" id="title"></h1>
  <div class="text" id="text">Cargando…</div>
</main>
<script src="app.js"></script>
</body>
</html>
